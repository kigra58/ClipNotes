<header class="site-header">
    <div class="container header-inner">
        <a class="brand" href="/" data-on:click__prevent="@get('/')">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </span>
            {{ app_title }}
        </a>
        {% if user %}
        <nav class="nav">
            <a href="/speak" data-on:click__prevent="@get('/speak')">Speak</a>
            <span class="nav-user">{{ user.email }}</span>
            <form method="post" action="/auth/logout" class="inline-form" data-on:submit="@post('/auth/logout')">
                <button type="submit" class="nav-link">Logout</button>
            </form>
        </nav>
        {% else %}
        <nav class="nav">
            <a href="/speak" data-on:click__prevent="@get('/speak')">Speak</a>
            <a href="/login" data-on:click__prevent="@get('/login')">Login</a>
            <a class="nav-cta" href="/signup" data-on:click__prevent="@get('/signup')">Signup</a>
        </nav>
        {% endif %}
    </div>
</header>
