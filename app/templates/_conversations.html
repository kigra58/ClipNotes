<ul class="conversation-list" id="conversation-list">
    {% for conversation in conversations %}
    <li class="conversation-item {% if active and active.id == conversation.id %}active{% endif %}">
        <a class="conversation-title" href="/videos/{{ conversation.video_id }}/chat?conversation={{ conversation.id }}" data-on:click__prevent="@get('/videos/{{ conversation.video_id }}/chat?conversation={{ conversation.id }}')">
            {{ conversation.title }}
        </a>
        <button
            class="icon-btn"
            title="Delete conversation"
            data-on:click="@post('/chats/{{ conversation.id }}/delete')"
        >&times;</button>
    </li>
    {% else %}
    <li class="conversation-empty">No conversations yet.</li>
    {% endfor %}
</ul>
