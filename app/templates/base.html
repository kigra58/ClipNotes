<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_title }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css?v={{ app_version }}">
    <script type="module" src="/static/datastar.js"></script>
    <script type="module" src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</head>
<body>
    {% include "_header.html" %}

    <main class="container {% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <span>Private · Local · AI-powered — your data stays on your server</span>
            <span>VidNotes · YouTube transcript &amp; chat</span>
        </div>
    </footer>
</body>
</html>
